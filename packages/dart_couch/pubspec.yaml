  collection: ^1.19.1
  path: ^1.9.1
  mutex: ^3.1.0
  async_queue: ^3.0.0
  meta: ^1.19.0
  ffi: ^2.2.0
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.3
  lints: ^6.1.0
  dart_mappable_builder: ^4.10.1
  build_version: ^2.2.1
  test: ^1.33.0
  test_api: ^0.7.15
  flutter_lints: ^6.0.0
