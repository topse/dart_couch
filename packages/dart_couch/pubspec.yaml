name: dart_couch
description: "A Dart binding for CouchDB with offline first capabilities, with ideas from PouchDB which I loved very much in the JS world."

# IMPORTANT:
# to update version.dart: dart run build_runner build
version: 1.0.26+1

homepage:

environment:
  sdk: ^3.10.0

dependencies:
  drift: ^2.35.4
  http: ^1.6.0
  logging: ^1.3.0
