#          -> couch_peruser / enable: true
#                             delete_dbs: true
#          -> chttpd / admin_only_all_dbs  :  false
#          -> chttpd_auth / users_db_public: true
#          -> public_fields: _id, name, type, role
#          -> couchdb / max_document_size: 20000000

; No [couchdb] uuid and no [chttpd_auth] secret here on purpose: CouchDB
; generates both on first start and persists them into the writable local.ini
; on the target. They are per-installation secrets (the secret signs session
; cookies) and must never be committed to the repo.

[log]
#level = debug
level = info

[couchdb]
single_node=true
max_document_size = 20000000
uuid = 230e69d739c00671e05636a76d5e15a0

[couch_peruser]
enable = true
delete_dbs = true

[chttpd]
# false ist der default wert:
#admin_only_all_dbs = true

[admins]
admin = -pbkdf2:sha256-465f86c1df913a2e7502ef7ed81eec05bcef8c49ccdfa4c8628d7aef07979cd3,dc3471bba308e80b963c0d252212df0d,600000

[chttpd_auth]
users_db_public=true
public_fields=_id, name, type, role
secret = 737890c966f0a131c060f413391fee3e
