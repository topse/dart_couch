version: 1.0.20+1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  dart_couch:
    path: ../dart_couch
  logging: ^1.3.0
  path: ^1.9.1
  wakelock_plus: ^1.8.2
  material_ui: ^1.11.1

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
